<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Day Hybrid Workout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1117;
      color: #f5f5f5;
      padding: 16px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.55rem;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 0.9rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f1117;
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .tabs button {
      border: 1px solid #343a52;
      background: #1c2030;
      color: white;
      padding: 10px 4px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #4f7cff;
      border-color: #4f7cff;
    }

    .day {
      display: none;
    }

    .day.active {
      display: block;
    }

    .day-title {
      font-size: 1.25rem;
      margin: 14px 0;
    }

    details {
      background: #181b27;
      border: 1px solid #2b3042;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    summary {
      background: #202536;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .content {
      padding: 14px;
    }

    .exercise {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #30364a;
    }

    .exercise:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .exercise-name {
      font-weight: bold;
      color: white;
    }

    .sets {
      color: #bfc7ff;
      font-size: 0.95rem;
      margin-top: 3px;
    }

    .cooldown {
      background: #111827;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 14px;
      margin: 16px 0 28px;
    }

    .cooldown h3 {
      margin-bottom: 8px;
    }

    .cooldown ul {
      padding-left: 20px;
      color: #d5d5d5;
    }
  </style>
</head>
<body>
  <header>
    <h1>8-Day Hybrid Program</h1>
    <p class="subtitle">Full Body • Calisthenics • Chest / Back / Abs Focus</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>

  <script>
    const warmup = [
      "Foam Roller Upper Back — 60 sec",
      "Band Pull-Aparts — 2 x 20",
      "Scapular Pullups — 2 x 8",
      "Pushups — 2 x 10",
      "Bodyweight Squats — 2 x 15",
      "Light Dynamic Stretching — 2 min"
    ];

    const workouts = [
      {
        title: "DAY 1 — POWER AESTHETIC",
        supersets: [
          ["Back + Biceps", ["Slow Tempo Pullups — 4 x 8-12", "Dumbbell Curls — 4 x 8-12"]],
          ["Back + Biceps", ["Heavy One-Arm Dumbbell Rows — 4 x 8-12", "Hammer Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Incline Dumbbell Press — 4 x 8-12", "Overhead Dumbbell Tricep Extensions — 4 x 10-12"]],
          ["Chest + Triceps", ["Backpack/Plate Weighted Deficit Pushups — 4 x 10-15", "Diamond Pushups — 4 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Dumbbell Shoulder Press — 4 x 8-12", "Bulgarian Split Squats — 4 x 8-12"]],
          ["Shoulders + Upper Legs", ["Lateral Raises — 4 x 12-15", "Romanian Deadlifts — 4 x 8-12"]],
          ["Calves/Forearms + Abs", ["Standing Calf Raises — 4 x 15-20", "Hanging Leg Raises — 4 x 10-15"]],
          ["Calves/Forearms + Abs", ["Wrist Curls + Reverse Wrist Curls — 4 x 12-15", "Weighted Crunches — 4 x 12-15"]]
        ],
        cooldown: [
          "Dead Hangs — 45-60 sec",
          "Doorway Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 2 — CALISTHENICS DOMINANCE",
        supersets: [
          ["Back + Biceps", ["Wide Grip Pullups — 4 x 8-AMRAP", "Alternating Dumbbell Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Chinups — 4 x 8-AMRAP", "Cross-Body Hammer Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Dips — 4 x AMRAP", "Dumbbell Skull Crushers — 4 x 10-12"]],
          ["Chest + Triceps", ["Explosive Pushups — 4 x 10-15", "Close-Grip Pushups — 4 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Pike Pushups — 4 x 10-15", "Goblet Squats — 4 x 12-15"]],
          ["Shoulders + Upper Legs", ["Leaning Lateral Raises — 4 x 12-15", "Jump Squats — 4 x 12-15"]],
          ["Calves/Forearms + Abs", ["Single-Leg Calf Raises — 4 x 15-20", "Hanging Knee Raises — 4 x 15-20"]],
          ["Calves/Forearms + Abs", ["Farmer Holds — 4 x 30-45 sec", "Hollow Body Holds — 4 x 30-60 sec"]]
        ],
        cooldown: [
          "Dead Hangs — 45-60 sec",
          "Shoulder Cross-Body Stretch — 45 sec each side",
          "Child's Pose Lat Stretch — 60 sec",
          "Couch Stretch / Hip Flexor Stretch — 45 sec each side",
          "Seated Hamstring Stretch — 45 sec each side",
          "Butterfly Stretch — 60 sec",
          "Deep Breathing — 1 min"
        ]
      },
      {
        title: "DAY 3 — HYPERTROPHY / PUMP",
        supersets: [
          ["Back + Biceps", ["Slow Eccentric Pullups — 4 x 6-10", "Incline Dumbbell Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Chest-Supported Dumbbell Rows — 4 x 10-12", "Reverse Grip Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Flat Dumbbell Press — 4 x 10-12", "Dumbbell Kickbacks — 4 x 12-15"]],
          ["Chest + Triceps", ["Deficit Pushups — 4 x 12-15", "Bench Dips — 4 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Arnold Press — 4 x 10-12", "Dumbbell Lunges — 4 x 10-12"]],
          ["Shoulders + Upper Legs", ["Rear Delt Flyes — 4 x 12-15", "Dumbbell Step-Ups — 4 x 10-12"]],
          ["Calves/Forearms + Abs", ["Seated Calf Raises — 4 x 15-20", "Hanging Leg Raises — 4 x 12-15"]],
          ["Calves/Forearms + Abs", ["Reverse Wrist Curls — 4 x 12-15", "Russian Twists — 4 x 20 total"]]
        ],
        cooldown: [
          "Lat Stretch — 45 sec each side",
          "Doorway Chest Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Figure-4 Glute Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Wrist Flexor + Extensor Stretch — 30 sec each",
          "Light Hanging — 45 sec"
        ]
      },
      {
        title: "DAY 4 — HYBRID CHAOS",
        supersets: [
          ["Back + Biceps", ["Archer Pullups / Assisted Archer Pullups — 4 x 6-10", "Zottman Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Explosive Dumbbell Rows — 4 x 8-12", "Concentration Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Feet-Elevated Deficit Pushups — 4 x 10-15", "Overhead Band Tricep Extensions — 4 x 12-15"]],
          ["Chest + Triceps", ["Dumbbell Squeeze Press — 4 x 10-12", "Diamond Deficit Pushups — 4 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Dumbbell Push Press — 4 x 8-12", "Bulgarian Split Squats — 4 x 10-12"]],
          ["Shoulders + Upper Legs", ["Partial Lateral Raises Burnout — 4 x 15-20", "Dumbbell Romanian Deadlifts — 4 x 10-12"]],
          ["Calves/Forearms + Abs", ["Explosive Calf Raises — 4 x 20", "Toes-to-Bar / Hanging Leg Raises — 4 x 10-15"]],
          ["Calves/Forearms + Abs", ["Farmer Carries — 4 rounds", "Plank to Failure — 4 sets"]]
        ],
        cooldown: [
          "Dead Hangs — 45-60 sec",
          "Cobra Stretch — 45 sec",
          "Child's Pose — 60 sec",
          "Hip Flexor Stretch — 45 sec each side",
          "Deep Squat Hold — 60 sec",
          "Shoulder Wall Stretch — 45 sec each side",
          "Controlled Breathing — 1 min"
        ]
      },
      {
        title: "DAY 5 — STRENGTH OVERDRIVE",
        supersets: [
          ["Back + Biceps", ["Paused Chinups — 5 x 8-10", "Heavy Dumbbell Curls — 5 x 6-10"]],
          ["Back + Biceps", ["Pendlay Dumbbell Rows — 5 x 6-10", "Hammer Curl Holds — 5 x 20-30 sec"]],
          ["Chest + Triceps", ["Heavy Incline Dumbbell Press — 5 x 5-8", "Heavy Skull Crushers — 5 x 8-10"]],
          ["Chest + Triceps", ["Backpack/Plate Weighted Pushups — 5 x 8-12", "Close-Grip Deficit Pushups — 5 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Heavy Dumbbell Shoulder Press — 5 x 6-10", "Heavy Goblet Squats — 5 x 8-12"]],
          ["Shoulders + Upper Legs", ["Upright Rows — 5 x 10-12", "Romanian Deadlifts — 5 x 8-10"]],
          ["Calves/Forearms + Abs", ["Weighted Calf Raises — 5 x 15-20", "Hanging Windshield Wipers — 5 x 8-12"]],
          ["Calves/Forearms + Abs", ["Wrist Roller / Wrist Curls — 5 rounds", "Weighted Plank — 5 x 45-60 sec"]]
        ],
        cooldown: [
          "Deep Lat Stretch — 45 sec each side",
          "Doorway Pec Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Forearm Stretch — 30 sec each side",
          "Controlled Breathing — 1-2 min"
        ]
      },
      {
        title: "DAY 6 — V-TAPER FORGE",
        supersets: [
          ["Back + Biceps", ["Wide Neutral-Grip Pullups — 4 x 8-12", "Bayesian Band Curls — 4 x 10-12"]],
          ["Back + Biceps", ["One-Arm Lat-Focused Dumbbell Rows — 4 x 10-12", "Reverse Dumbbell Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Incline Dumbbell Fly Press — 4 x 10-12", "Dumbbell Tate Press — 4 x 10-12"]],
          ["Chest + Triceps", ["Ring/Handle Pushups — 4 x 12-15", "Bench Diamond Dips — 4 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Lean-Away Lateral Raises — 4 x 12-15", "Dumbbell Front Squats — 4 x 10-12"]],
          ["Shoulders + Upper Legs", ["Rear Delt Rows — 4 x 12-15", "Walking Lunges — 4 x 12-16 steps"]],
          ["Calves/Forearms + Abs", ["Single-Leg Weighted Calf Raises — 4 x 15-20", "Hanging Straight-Leg Raises — 4 x 10-15"]],
          ["Calves/Forearms + Abs", ["Dumbbell Finger Curls — 4 x 12-15", "Side Plank Holds — 4 x 30-45 sec each side"]]
        ],
        cooldown: [
          "Dead Hangs — 45-60 sec",
          "Thoracic Extension Stretch — 60 sec",
          "Lat Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Pigeon Stretch / Figure-4 Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Neck + Trap Stretch — 30 sec each side"
        ]
      },
      {
        title: "DAY 7 — CALISTHENICS WARPATH",
        supersets: [
          ["Back + Biceps", ["Typewriter Pullups / Assisted Typewriters — 4 x 6-10", "Alternating Hammer Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Towel Grip Chinups — 4 x 8-AMRAP", "Slow Eccentric Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Ring/Handle Archer Pushups — 4 x 8-12", "Dumbbell Skull Crushers — 4 x 10-12"]],
          ["Chest + Triceps", ["Clap Pushups / Explosive Pushups — 4 x 8-15", "Tight-Grip Pushups — 4 x AMRAP"]],
          ["Shoulders + Upper Legs", ["Elevated Pike Pushups — 4 x 8-12", "Dumbbell Jump Squats — 4 x 10-15"]],
          ["Shoulders + Upper Legs", ["Dumbbell Lateral Raise Dropset — 4 rounds", "Bulgarian Split Squats — 4 x 10-12"]],
          ["Calves/Forearms + Abs", ["Explosive Single-Leg Calf Raises — 4 x 15-20", "Toes-to-Bar / Hanging Raises — 4 x 10-15"]],
          ["Calves/Forearms + Abs", ["Towel Farmer Holds — 4 x 30-45 sec", "Hollow Rocks — 4 x 20-30 sec"]]
        ],
        cooldown: [
          "Wrist Mobility Stretch — 60 sec",
          "Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Deep Hanging — 45-60 sec",
          "Deep Squat Hold — 60 sec",
          "Butterfly Stretch — 60 sec",
          "Hamstring Stretch — 45 sec each side"
        ]
      },
      {
        title: "DAY 8 — TITAN REFINEMENT",
        supersets: [
          ["Back + Biceps", ["Close-Grip Pullups — 4 x 8-12", "Spider Curls — 4 x 10-12"]],
          ["Back + Biceps", ["Meadows Dumbbell Rows — 4 x 10-12", "Cross-Body Dumbbell Curls — 4 x 10-12"]],
          ["Chest + Triceps", ["Incline Dumbbell Press (slow eccentric) — 4 x 8-12", "JM Press — 4 x 8-12"]],
          ["Chest + Triceps", ["Deep Deficit Pushups — 4 x 12-15", "Overhead Dumbbell Extensions — 4 x 10-12"]],
          ["Shoulders + Upper Legs", ["Arnold Press — 4 x 10-12", "Heel-Elevated Goblet Squats — 4 x 10-15"]],
          ["Shoulders + Upper Legs", ["Rear Delt Flyes — 4 x 12-15", "Dumbbell Romanian Deadlifts — 4 x 10-12"]],
          ["Calves/Forearms + Abs", ["Standing Weighted Calf Raises — 4 x 15-20", "Hanging Knee-to-Elbow Raises — 4 x 12-15"]],
          ["Calves/Forearms + Abs", ["Reverse Wrist Curls + Wrist Rotations — 4 x 12-15", "Weighted Situps — 4 x 12-15"]]
        ],
        cooldown: [
          "Dead Hangs — 45-60 sec",
          "Pec Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Spinal Twist — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Breathing Cooldown — 1-2 min"
        ]
      }
    ];

    const tabs = document.getElementById("tabs");
    const app = document.getElementById("app");

    workouts.forEach((workout, index) => {
      const button = document.createElement("button");
      button.textContent = "Day " + (index + 1);
      if (index === 0) button.classList.add("active");
      button.onclick = () => showDay(index);
      tabs.appendChild(button);

      const section = document.createElement("section");
      section.className = "day" + (index === 0 ? " active" : "");

      section.innerHTML = `
        <h2 class="day-title">${workout.title}</h2>

        <div class="cooldown">
          <h3>Warmup</h3>
          <ul>${warmup.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        ${workout.supersets.map((superset, supersetIndex) => `
          <details>
            <summary>Superset ${supersetIndex + 1} — ${superset[0]}</summary>
            <div class="content">
              ${superset[1].map(exercise => {
                const parts = exercise.split(" — ");
                return `
                  <div class="exercise">
                    <div class="exercise-name">${parts[0]}</div>
                    <div class="sets">${parts[1] || ""}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </details>
        `).join("")}
        <div class="cooldown">
          <h3>Cooldown</h3>
          <ul>${workout.cooldown.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>
      `;

      app.appendChild(section);
    });

    function showDay(index) {
      document.querySelectorAll(".day").forEach((day, i) => {
        day.classList.toggle("active", i === index);
      });

      document.querySelectorAll(".tabs button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
