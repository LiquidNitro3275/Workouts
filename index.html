    .sets { color: #bfc7ff; font-size: 0.95rem; margin-top: 3px; }
    .block { background: #111827; border: 1px solid #2d3748; border-radius: 16px; padding: 14px; margin: 16px 0 28px; }

    .tag { display: inline-block; margin: 4px 4px 0 0; padding: 4px 8px; border-radius: 999px; background: #202536; border: 1px solid #343a52; color: #d5d5d5; font-size: 0.82rem; }

      if (index === 0) button.classList.add("active");
      button.onclick = () => showDay(index);
      tabs.appendChild(button);

      section.className = "day" + (index === 0 ? " active" : "");

      section.innerHTML = `
        <h2 class="day-title">${workout.title}</h2>

        <div class="block">
          <h3>Warmup + APT Prep</h3>
          <ul>${workout.warmup.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

          <details>
            <summary>Superset ${supersetIndex + 1} — ${superset[0]}</summary>
            <div class="content">
              ${superset[1].map(exercise => {
                const parts = exercise.split(" — ");
                return `
                  <div class="exercise">
                    <div class="exercise-name">${parts[0]}</div>
                    <div class="sets">${parts[1] || ""}</div>

                `;

          <ul>${protocol.map(item => `<li class="${item.includes("Actual fighting") || item.includes("If technique") ? "warning" : ""}">${item}</li>`).join("")}</ul>
        </div>

      document.querySelectorAll(".day").forEach((day, i) => {
        day.classList.toggle("active", i === index);
      });

      document.querySelectorAll(".tabs button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
