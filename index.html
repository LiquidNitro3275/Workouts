          "Cross-Body Rear Shoulder Stretch — 2 x 20-30 sec each side",
          "Overhead Triceps Stretch — 2 x 20-30 sec each side",
          "Wall Biceps Stretch — 2 x 20-30 sec each side",
          "Wrist Flexor Stretch — 2 x 20-30 sec each side",
          "Wrist Extensor Stretch — 2 x 20-30 sec each side",
          "Standing Quad Stretch — 2 x 20-30 sec each side",
          "Kneeling Hip Flexor Stretch — 2 x 20-30 sec each side",
          "Seated Hamstring Stretch — 2 x 20-30 sec each side",
          "Figure-4 Glute Stretch — 2 x 20-30 sec each side",
          "Butterfly Adductor Stretch — 2 x 20-30 sec",
          "Wall Calf Stretch — 2 x 20-30 sec each side",
          "Cobra Abdominal Stretch — 2 x 20-30 sec",
          "Child's Pose Lower-Back Stretch — 2 x 20-30 sec"
        ]
      }
    ];

    const tabs = document.getElementById("tabs");
    const app = document.getElementById("app");

    workouts.forEach((workout, index) => {
      const button = document.createElement("button");
      button.textContent = "Day " + (index + 1);
      if (index === 0) button.classList.add("active");
      button.onclick = () => showDay(index);
      tabs.appendChild(button);

      const section = document.createElement("section");
      section.className = "day" + (index === 0 ? " active" : "");

      section.innerHTML = `
        <h2 class="day-title">${workout.title}</h2>

        <div class="cooldown">
          <h3>Warmup</h3>
          <ul>${workout.warmup.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        ${workout.supersets.map((superset, supersetIndex) => `
          <details>
            <summary>Superset ${supersetIndex + 1} — ${superset[0]}</summary>
            <div class="content">
              ${superset[1].map(exercise => {
                const parts = exercise.split(" — ");
                return `
                  <div class="exercise">
                    <div class="exercise-name">${parts[0]}</div>
                    <div class="sets">${parts[1] || ""}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </details>
        `).join("")}
        <div class="cooldown">
          <h3>Cooldown</h3>
          <ul>${workout.cooldown.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>
      `;

      app.appendChild(section);
    });

    function showDay(index) {
      document.querySelectorAll(".day").forEach((day, i) => {
        day.classList.toggle("active", i === index);
      });

      document.querySelectorAll(".tabs button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
