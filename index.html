<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Day Gym-Calisthenics Warrior Program</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1117;
      color: #f5f5f5;
      padding: 16px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.55rem;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #b8b8b8;
      font-size: 0.9rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f1117;
      padding: 10px 0;
      margin-bottom: 12px;
    }

    .tabs button {
      border: 1px solid #343a52;
      background: #1c2030;
      color: white;
      padding: 10px 4px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #4f7cff;
      border-color: #4f7cff;
    }

    .day {
      display: none;
    }

    .day.active {
      display: block;
    }

    .day-title {
      font-size: 1.25rem;
      margin: 14px 0;
    }

    details {
      background: #181b27;
      border: 1px solid #2b3042;
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    summary {
      background: #202536;
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .content {
      padding: 14px;
    }

    .exercise {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #30364a;
    }

    .exercise:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .exercise-name {
      font-weight: bold;
      color: white;
    }

    .sets {
      color: #bfc7ff;
      font-size: 0.95rem;
      margin-top: 3px;
    }

    .card {
      background: #111827;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 14px;
      margin: 16px 0;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .card ul {
      padding-left: 20px;
      color: #d5d5d5;
    }

    .rules {
      color: #d5d5d5;
      font-size: 0.95rem;
    }

    .rules strong {
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>8-Day Gym-Calisthenics Warrior Program</h1>
    <p class="subtitle">Full Body • Calisthenics First • Gym Equipment Second • Clean Warrior Build</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>

  <script>
    const cardioOptions = [
      "Treadmill Incline Walk — 30-45 min | Incline 8-15 | Moderate pace",
      "Stairmaster — 20-30 min + Bike/Treadmill Walk — 10-15 min",
      "Elliptical or Bike — 35-45 min | Joint-friendly pace",
      "Rowing Machine — 10-15 min + Incline Walk — 20-30 min"
    ];

    const warmup = [
      "Dead Hang — 30-45 sec",
      "Band Pull-Aparts — 2 x 20",
      "Scapular Pullups — 2 x 8",
      "Pushups — 2 x 10",
      "Bodyweight Squats — 2 x 15",
      "Walking Lunges — 1 x 10 each leg",
      "Shoulder Circles — 30 sec forward + 30 sec backward",
      "Light Cable Face Pulls — 2 x 15"
    ];

    const rules = [
      "Rest 10-20 sec between exercises inside a superset.",
      "Rest 60-90 sec after each superset.",
      "On strength-heavy days, rest 90-120 sec if needed.",
      "Bodyweight movement comes first; machines support the warrior build, they do not replace it.",
      "Stop immediately if sharp pain appears. Keep reps controlled and clean."
    ];

    const workouts = [
      {
        title: "DAY 1 — POWER AESTHETIC",
        supersets: [
          ["Back and Biceps", ["Pullups / Assisted Pullups — 4 x 8-12", "Standing Dumbbell Curls — 4 x 8-12"]],
          ["Back and Biceps", ["Seated Cable Rows — 4 x 10-12", "Hammer Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Weighted Dips / Assisted Dips — 4 x 8-12", "Cable Tricep Pushdowns — 4 x 10-15"]],
          ["Chest and Triceps", ["Incline Dumbbell Press — 4 x 8-12", "Diamond Pushups — 4 x AMRAP"]],
          ["Shoulders and Upper Legs", ["Dumbbell Shoulder Press — 4 x 8-12", "Bulgarian Split Squats — 4 x 8-12 each leg"]],
          ["Shoulders and Upper Legs", ["Cable Lateral Raises — 4 x 12-15", "Romanian Deadlifts — 4 x 8-12"]],
          ["Lower Legs and Abs", ["Standing Calf Raise Machine — 4 x 15-20", "Hanging Leg Raises — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Farmer Carries — 4 x 30-45 sec", "Cable Crunches — 4 x 12-15"]]
        ],
        cooldown: [
          "Dead Hang — 45-60 sec",
          "Lat Stretch — 45 sec each side",
          "Doorway Chest Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Deep Breathing — 1-2 min"
        ]
      },
      {
        title: "DAY 2 — CALISTHENICS DOMINANCE",
        supersets: [
          ["Back and Biceps", ["Wide-Grip Pullups / Assisted Wide-Grip Pullups — 4 x 8-AMRAP", "EZ-Bar Curls — 4 x 10-12"]],
          ["Back and Biceps", ["Chinups / Assisted Chinups — 4 x 8-AMRAP", "Cable Rope Hammer Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Parallel Bar Dips — 4 x AMRAP", "Overhead Cable Tricep Extensions — 4 x 12-15"]],
          ["Chest and Triceps", ["Explosive Pushups — 4 x 8-15", "Close-Grip Pushups — 4 x AMRAP"]],
          ["Shoulders and Upper Legs", ["Pike Pushups / Machine Shoulder Press — 4 x 8-12", "Goblet Squats — 4 x 12-15"]],
          ["Shoulders and Upper Legs", ["Rear Delt Cable Flyes — 4 x 12-15", "Leg Press — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Seated Calf Raise Machine — 4 x 15-20", "Captain's Chair Knee Raises — 4 x 15-20"]],
          ["Lower Legs and Abs", ["Plate Pinch Holds — 4 x 30-45 sec", "Hollow Body Holds — 4 x 30-60 sec"]]
        ],
        cooldown: [
          "Shoulder Cross-Body Stretch — 45 sec each side",
          "Child's Pose Lat Stretch — 60 sec",
          "Couch Stretch — 45 sec each side",
          "Deep Squat Hold — 60 sec",
          "Seated Hamstring Stretch — 45 sec each side",
          "Butterfly Stretch — 60 sec",
          "Controlled Breathing — 1-2 min"
        ]
      },
      {
        title: "DAY 3 — HYPERTROPHY / PUMP",
        supersets: [
          ["Back and Biceps", ["Slow Eccentric Pullups — 4 x 6-10", "Incline Dumbbell Curls — 4 x 10-12"]],
          ["Back and Biceps", ["Lat Pulldowns — 4 x 10-12", "Reverse-Grip EZ-Bar Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Flat Dumbbell Press — 4 x 10-12", "Rope Tricep Pushdowns — 4 x 12-15"]],
          ["Chest and Triceps", ["Deficit Pushups — 4 x 12-15", "Bench Dips — 4 x AMRAP"]],
          ["Shoulders and Upper Legs", ["Arnold Press — 4 x 10-12", "Walking Lunges — 4 x 12-16 steps"]],
          ["Shoulders and Upper Legs", ["Machine Lateral Raises — 4 x 12-15", "Hamstring Curl Machine — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Calf Press on Leg Press Machine — 4 x 15-20", "Hanging Leg Raises — 4 x 12-15"]],
          ["Lower Legs and Abs", ["Reverse Wrist Curls — 4 x 12-15", "Russian Twists with Plate — 4 x 20 total"]]
        ],
        cooldown: [
          "Lat Stretch — 45 sec each side",
          "Pec Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Figure-4 Glute Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Wrist Flexor Stretch — 30 sec each side",
          "Wrist Extensor Stretch — 30 sec each side"
        ]
      },
      {
        title: "DAY 4 — HYBRID CHAOS",
        supersets: [
          ["Back and Biceps", ["Archer Pullups / Assisted Archer Pullups — 4 x 6-10", "Zottman Curls — 4 x 10-12"]],
          ["Back and Biceps", ["Chest-Supported Row Machine — 4 x 8-12", "Concentration Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Feet-Elevated Pushups — 4 x 10-15", "Cable Tricep Pushdowns — 4 x 12-15"]],
          ["Chest and Triceps", ["Cable Chest Flyes — 4 x 10-15", "Diamond Deficit Pushups — 4 x AMRAP"]],
          ["Shoulders and Upper Legs", ["Dumbbell Push Press — 4 x 8-12", "Hack Squat / Smith Machine Squat — 4 x 8-12"]],
          ["Shoulders and Upper Legs", ["Partial Lateral Raise Burnout — 4 x 15-20", "Dumbbell Romanian Deadlifts — 4 x 10-12"]],
          ["Lower Legs and Abs", ["Explosive Calf Raises — 4 x 20", "Toes-to-Bar / Hanging Leg Raises — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Farmer Carries — 4 rounds", "Plank — 4 x 45-75 sec"]]
        ],
        cooldown: [
          "Dead Hang — 45-60 sec",
          "Cobra Stretch — 45 sec",
          "Child's Pose — 60 sec",
          "Hip Flexor Stretch — 45 sec each side",
          "Deep Squat Hold — 60 sec",
          "Shoulder Wall Stretch — 45 sec each side",
          "Controlled Breathing — 1-2 min"
        ]
      },
      {
        title: "DAY 5 — STRENGTH OVERDRIVE",
        supersets: [
          ["Back and Biceps", ["Weighted Chinups / Heavy Assisted Chinups — 5 x 5-8", "Heavy Dumbbell Curls — 5 x 6-10"]],
          ["Back and Biceps", ["Heavy Seated Cable Rows — 5 x 6-10", "Hammer Curl Holds — 5 x 20-30 sec"]],
          ["Chest and Triceps", ["Weighted Dips / Heavy Assisted Dips — 5 x 5-8", "Heavy Rope Pushdowns — 5 x 8-10"]],
          ["Chest and Triceps", ["Heavy Incline Dumbbell Press — 5 x 5-8", "Close-Grip Deficit Pushups — 5 x AMRAP"]],
          ["Shoulders and Upper Legs", ["Heavy Dumbbell Shoulder Press — 5 x 6-10", "Leg Press — 5 x 8-12"]],
          ["Shoulders and Upper Legs", ["Upright Rows / Cable High Pulls — 5 x 10-12", "Romanian Deadlifts — 5 x 8-10"]],
          ["Lower Legs and Abs", ["Weighted Standing Calf Raises — 5 x 15-20", "Hanging Windshield Wipers — 5 x 8-12"]],
          ["Lower Legs and Abs", ["Wrist Roller / Dumbbell Wrist Curls — 5 rounds", "Weighted Plank — 5 x 45-60 sec"]]
        ],
        cooldown: [
          "Deep Lat Stretch — 45 sec each side",
          "Doorway Pec Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Quad Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Forearm Stretch — 30 sec each side",
          "Controlled Breathing — 1-2 min"
        ]
      },
      {
        title: "DAY 6 — V-TAPER FORGE",
        supersets: [
          ["Back and Biceps", ["Wide Neutral-Grip Pullups — 4 x 8-12", "Bayesian Cable Curls — 4 x 10-12"]],
          ["Back and Biceps", ["Single-Arm Cable Lat Rows — 4 x 10-12", "Reverse Dumbbell Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Incline Dumbbell Press — 4 x 8-12", "Cable Overhead Tricep Extensions — 4 x 10-12"]],
          ["Chest and Triceps", ["Ring Pushups / Handle Pushups — 4 x 12-15", "Machine Chest Press — 4 x 10-12"]],
          ["Shoulders and Upper Legs", ["Lean-Away Cable Lateral Raises — 4 x 12-15", "Dumbbell Front Squats — 4 x 10-12"]],
          ["Shoulders and Upper Legs", ["Rear Delt Rows — 4 x 12-15", "Walking Lunges — 4 x 12-16 steps"]],
          ["Lower Legs and Abs", ["Single-Leg Weighted Calf Raises — 4 x 15-20", "Hanging Straight-Leg Raises — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Dumbbell Finger Curls — 4 x 12-15", "Side Plank Holds — 4 x 30-45 sec each side"]]
        ],
        cooldown: [
          "Dead Hang — 45-60 sec",
          "Thoracic Extension Stretch — 60 sec",
          "Lat Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Figure-4 Stretch — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Neck and Trap Stretch — 30 sec each side"
        ]
      },
      {
        title: "DAY 7 — CALISTHENICS WARPATH",
        supersets: [
          ["Back and Biceps", ["Typewriter Pullups / Assisted Typewriters — 4 x 6-10", "Alternating Hammer Curls — 4 x 10-12"]],
          ["Back and Biceps", ["Towel Grip Chinups / Rope Grip Pulldowns — 4 x 8-AMRAP", "Slow Eccentric Cable Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Archer Pushups / Assisted Archer Pushups — 4 x 8-12", "Dumbbell Skull Crushers — 4 x 10-12"]],
          ["Chest and Triceps", ["Clap Pushups / Explosive Pushups — 4 x 8-15", "Cable Tricep Pushdowns — 4 x 12-15"]],
          ["Shoulders and Upper Legs", ["Elevated Pike Pushups — 4 x 8-12", "Dumbbell Jump Squats — 4 x 10-15"]],
          ["Shoulders and Upper Legs", ["Cable Lateral Raise Dropset — 4 rounds", "Bulgarian Split Squats — 4 x 10-12 each leg"]],
          ["Lower Legs and Abs", ["Explosive Single-Leg Calf Raises — 4 x 15-20", "Toes-to-Bar / Hanging Raises — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Towel Farmer Holds — 4 x 30-45 sec", "Hollow Rocks — 4 x 20-30 sec"]]
        ],
        cooldown: [
          "Wrist Mobility Stretch — 60 sec",
          "Chest Stretch — 45 sec each side",
          "Lat Stretch — 45 sec each side",
          "Deep Hanging — 45-60 sec",
          "Deep Squat Hold — 60 sec",
          "Butterfly Stretch — 60 sec",
          "Hamstring Stretch — 45 sec each side"
        ]
      },
      {
        title: "DAY 8 — TITAN REFINEMENT",
        supersets: [
          ["Back and Biceps", ["Close-Grip Pullups — 4 x 8-12", "Spider Curls / Preacher Curls — 4 x 10-12"]],
          ["Back and Biceps", ["Meadows Row / T-Bar Row Machine — 4 x 10-12", "Cross-Body Dumbbell Curls — 4 x 10-12"]],
          ["Chest and Triceps", ["Incline Dumbbell Press, Slow Eccentric — 4 x 8-12", "JM Press / Close-Grip Smith Press — 4 x 8-12"]],
          ["Chest and Triceps", ["Deep Deficit Pushups — 4 x 12-15", "Overhead Cable Extensions — 4 x 10-12"]],
          ["Shoulders and Upper Legs", ["Arnold Press — 4 x 10-12", "Heel-Elevated Goblet Squats — 4 x 10-15"]],
          ["Shoulders and Upper Legs", ["Cable Rear Delt Flyes — 4 x 12-15", "Lying Hamstring Curls — 4 x 10-15"]],
          ["Lower Legs and Abs", ["Standing Weighted Calf Raises — 4 x 15-20", "Hanging Knee-to-Elbow Raises — 4 x 12-15"]],
          ["Lower Legs and Abs", ["Reverse Wrist Curls + Wrist Rotations — 4 x 12-15", "Weighted Situps / Decline Situps — 4 x 12-15"]]
        ],
        cooldown: [
          "Dead Hang — 45-60 sec",
          "Pec Stretch — 45 sec each side",
          "Hamstring Stretch — 45 sec each side",
          "Hip Flexor Stretch — 45 sec each side",
          "Spinal Twist — 45 sec each side",
          "Calf Stretch — 45 sec each side",
          "Breathing Cooldown — 1-2 min"
        ]
      }
    ];

    const tabs = document.getElementById("tabs");
    const app = document.getElementById("app");

    workouts.forEach((workout, index) => {
      const button = document.createElement("button");
      button.textContent = "Day " + (index + 1);
      if (index === 0) button.classList.add("active");
      button.onclick = () => showDay(index);
      tabs.appendChild(button);

      const section = document.createElement("section");
      section.className = "day" + (index === 0 ? " active" : "");

      section.innerHTML = `
        <h2 class="day-title">${workout.title}</h2>

        <div class="card">
          <h3>Cardio First — 30-45 min</h3>
          <ul>${cardioOptions.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        <div class="card">
          <h3>Warmup — 8-10 min</h3>
          <ul>${warmup.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        ${workout.supersets.map((superset, supersetIndex) => `
          <details>
            <summary>Superset ${supersetIndex + 1} — ${superset[0]}</summary>
            <div class="content">
              ${superset[1].map(exercise => {
                const parts = exercise.split(" — ");
                return `
                  <div class="exercise">
                    <div class="exercise-name">${parts[0]}</div>
                    <div class="sets">${parts[1] || ""}</div>
                  </div>
                `;
              }).join("")}
            </div>
          </details>
        `).join("")}

        <div class="card">
          <h3>Cooldown</h3>
          <ul>${workout.cooldown.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>

        <div class="card rules">
          <h3>Rules</h3>
          <ul>${rules.map(item => `<li>${item}</li>`).join("")}</ul>
        </div>
      `;

      app.appendChild(section);
    });

    function showDay(index) {
      document.querySelectorAll(".day").forEach((day, i) => {
        day.classList.toggle("active", i === index);
      });

      document.querySelectorAll(".tabs button").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
